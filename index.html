<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080b12" media="(prefers-color-scheme: dark)"/>
  <meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="TimeClock"/>
  <title>TimeClock</title>
  <script>
    // Prevent FOUC: resolve concept (weekday-aware) + scheme (OS-aware) early.
    // Keep the DOW list in sync with src/utils/themes.ts.
    try {
      var concept = JSON.parse(localStorage.getItem('tc-concept')) || 'auto';
      var scheme = JSON.parse(localStorage.getItem('tc-scheme')) || 'system';
      var DOW = ['clay', 'indigo', 'aurora', 'sunset', 'crt', 'brutal', 'lime'];
      var c = concept === 'auto' ? DOW[new Date().getDay()] : concept;
      var s = scheme === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : scheme;
      document.documentElement.setAttribute('data-theme', c + '-' + s);
    } catch (e) {}
  </script>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <link rel="icon" href="/favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@300;400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
