<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080b12" media="(prefers-color-scheme: dark)"/>
  <meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="TimeClock"/>
  <title>TimeClock</title>
  <script>
    // Prevent FOUC: resolve concept (weekday-aware) + scheme (OS-aware) early.
    // Keep the DOW list in sync with src/utils/themes.ts.
    // PR previews (/pr-preview/pr-N/) read their own copy once they've forked
    // from live data; keep in sync with src/utils/preview.ts.
    try {
      var m = location.pathname.match(/\/pr-preview\/pr-(\d+)\//);
      var pfx = m && localStorage.getItem('preview:pr-' + m[1] + ':__forked') !== null ? 'preview:pr-' + m[1] + ':' : '';
      var concept = JSON.parse(localStorage.getItem(pfx + 'tc-concept')) || 'auto';
      var scheme = JSON.parse(localStorage.getItem(pfx + 'tc-scheme')) || 'system';
      var DOW = ['clay', 'indigo', 'aurora', 'sunset', 'crt', 'brutal', 'lime'];
      var c = concept === 'auto' ? DOW[new Date().getDay()] : concept;
      var s = scheme === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : scheme;
      document.documentElement.setAttribute('data-theme', c + '-' + s);
    } catch (e) {}
  </script>
