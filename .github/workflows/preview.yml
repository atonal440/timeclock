name: PR preview

# Builds each PR to <site>/pr-preview/pr-<N>/ on the gh-pages branch and
# comments the link on the PR; removes it when the PR is merged or closed.
# Preview builds skip the service worker and keep their data under a
# `preview:pr-<N>:` localStorage prefix (see src/utils/preview.ts).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    # Fork PRs get a read-only token and can't publish.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build preview
        if: github.event.action != 'closed'
        run: npm ci && npm run build
        env:
          PREVIEW_BUILD: '1'
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_REF: ${{ github.head_ref }}
      - name: Publish or remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
