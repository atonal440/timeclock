name: Update Visual Snapshots (scratch)
on:
  push:
    branches: [ chore/update-visual-snapshots ]
permissions:
  contents: write
jobs:
  update:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Build Vite App
      run: npm run build
    - name: Update snapshots
      run: npx playwright test --update-snapshots
    - name: Commit updated snapshots back to this branch
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add tests/visual.spec.ts-snapshots
        if git diff --cached --quiet; then
          echo "No snapshot changes to commit"
        else
          git commit -m "Regenerate visual snapshots [skip ci]"
          git push origin HEAD:chore/update-visual-snapshots
        fi
